name: CI

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seamwork:
    name: Seamwork C++23 (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: nix develop --command env CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} cmake --preset release -G Ninja

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: nix develop --command cmake --build --preset release --parallel 2

      - name: Test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: nix develop --command ctest --preset release

      # Keep analysis in the existing Clang CI check, so a diagnostic fails
      # the same established gate without adding a redundant runner job.
      - name: C++23 static analysis (Clang)
        if: matrix.compiler == 'Clang'
        run: nix develop --command ./scripts/check-static-analysis.sh build/release
